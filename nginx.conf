events {
    worker_connections 1024;
}

http {
    upstream techstore-api {
        server app:8080;
    }

    # ── Social media bot detection ──────────────────────────────────────────
    # When a bot shares a product/category URL, redirect it to the Spring Boot
    # OG endpoint which returns proper Open Graph meta tags.
    # Real browsers get a <meta http-equiv="refresh"> and land on the React SPA.
    map $http_user_agent $is_social_bot {
        default                  0;
        ~*viber                  1;
        ~*facebookexternalhit    1;
        ~*twitterbot             1;
        ~*telegrambot            1;
        ~*whatsapp               1;
        ~*linkedinbot            1;
        ~*slackbot               1;
        ~*discordbot             1;
    }

    server {
        listen 80;
        server_name localhost;

        # API routes
        location /api/ {
            proxy_pass http://techstore-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger UI
        location /swagger-ui/ {
            proxy_pass http://techstore-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API docs
        location /v3/api-docs {
            proxy_pass http://techstore-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin panel
        location /admin/ {
            proxy_pass http://techstore-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /actuator/health {
            proxy_pass http://techstore-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── OG routing: /product/{slug}/{id} ──────────────────────────────
        # Always serve OG HTML — real browsers get instant meta-refresh redirect,
        # bots (Viber, Facebook, etc.) read the og: meta tags directly.
        location ~ ^/product/[^/]+/([0-9]+)$ {
            rewrite ^ /og/product/$1 break;
            proxy_pass http://techstore-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── OG routing: /category/{slug}/{id} ─────────────────────────────
        location ~ ^/category/[^/]+/([0-9]+)$ {
            rewrite ^ /og/category/$1 break;
            proxy_pass http://techstore-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default route
        location / {
            proxy_pass http://techstore-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}