# ── Datasource — H2 in-memory (replaces PostgreSQL for context-load tests) ──
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.search.enabled=false

# ── Flyway — disable (schema is managed by Hibernate ddl-auto in tests) ──────
spring.flyway.enabled=false

# ── Hikari ───────────────────────────────────────────────────────────────────
spring.hikari.maximum-pool-size=2
spring.hikari.minimum-idle=1

# ── Mail — dummy (no real SMTP in tests) ─────────────────────────────────────
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
MAIL_PASSWORD=test

# ── AWS S3 — dummy ────────────────────────────────────────────────────────────
AWS_ACCESS_KEY=test
AWS_SECRET_KEY=test
AWS_S3_BUCKET_NAME=test-bucket
AWS_S3_REGION=eu-central-1

# ── JWT ───────────────────────────────────────────────────────────────────────
JWT_SECRET=test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm
JWT_EXPIRATION=86400000
JWT_REFRESH_EXPIRATION=604800000

# ── CORS ─────────────────────────────────────────────────────────────────────
spring.cors.allowedOrigins=http://localhost:3000

# ── Upload dir ────────────────────────────────────────────────────────────────
UPLOAD_DIR=./uploads-test

# ── Admin seed ────────────────────────────────────────────────────────────────
ADMIN_USERNAME=admin
ADMIN_PASSWORD=admin123
ADMIN_EMAIL=admin@test.com

# ── External APIs — dummy ─────────────────────────────────────────────────────
TEKRA_API_BASE_URL=http://localhost
TEKRA_API_ACCESS_TOKEN=test
VALI_API_BASE_URL=http://localhost
VALI_API_TOKEN=test
VALI_EXCLUDED_CATEGORIES_IDS=1
ASBIS_USERNAME=test
ASBIS_PASSWORD=test

# ── Hibernate Search — disabled in tests ─────────────────────────────────────
spring.jpa.properties.hibernate.search.backend.directory.root=/tmp/lucene-test

# ── Speedy — dummy ───────────────────────────────────────────────────────────
# SPEEDY_SENDER_ID has to be here and has to be numeric: SpeedyConfig binds it to
# a Long, so an unresolved "${SPEEDY_SENDER_ID}" fails conversion and takes the
# whole application context down with it. The other placeholders below bind to
# String and so resolve to the literal "${...}" without complaining — harmless,
# but they are filled in anyway so the context matches production shape.
SPEEDY_USERNAME=test
SPEEDY_PASSWORD=test
SPEEDY_SENDER_ID=1

# ── TBI — dummy ──────────────────────────────────────────────────────────────
TBI_RESELLER_CODE=TEST
TBI_RESELLER_KEY=test-reseller-key
TBI_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef

# ── Postgres placeholders ────────────────────────────────────────────────────
# The datasource itself is H2 (above) and Flyway is off, but application.yml still
# references these in its flyway block and Spring resolves them while binding.
POSTGRES_DB=testdb
POSTGRES_USER=sa
POSTGRES_PASSWORD=

# ── Remaining placeholders with no default in application.yml ────────────────
CORS_ALLOWED_ORIGINS=http://localhost:3000
SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_BACKEND_DIRECTORY_ROOT=/tmp/lucene-test
