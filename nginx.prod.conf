# Production Nginx config — /etc/nginx/conf.d/caretech.bg.conf
# Deploy: cp nginx.prod.conf /etc/nginx/conf.d/caretech.bg.conf && nginx -t && systemctl reload nginx

# ── Rate limiting zones ────────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=api:10m      rate=20r/s;
limit_req_zone  $binary_remote_addr zone=general:10m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# ── Bad bot detection ──────────────────────────────────────────────
map $http_user_agent $bad_bot {
    default           0;
    ""                1;   # empty User-Agent
    ~*sqlmap          1;
    ~*nikto           1;
    ~*nmap            1;
    ~*masscan         1;
    ~*zgrab           1;
    ~*python-requests 1;
    ~*go-http-client  1;
    ~*curl/           1;
}

map $http_user_agent $is_social_crawler {
    default                   0;
    ~*facebookexternalhit     1;
    ~*Facebot                 1;
    ~*Twitterbot              1;
    ~*LinkedInBot             1;
    ~*TelegramBot             1;
    ~*Slackbot                1;
    ~*Discordbot              1;
    ~*WhatsApp                1;
    ~*vkShare                 1;
    ~*Viber                   1;
    ~*SkypeUriPreview         1;
    ~*Applebot                1;
    ~*iMessage                1;
    ~*Google-HTTP-Java-Client 1;
    ~*Signal                  1;
    ~*Odnoklassniki           1;
}

server {
    server_name caretech.bg www.caretech.bg;

    client_max_body_size 50M;

    # ── Global limits ──────────────────────────────────────────────
    limit_conn conn 30;

    # ── Block bad bots ─────────────────────────────────────────────
    if ($bad_bot) { return 444; }

    # ── Block common scan/attack paths ────────────────────────────
    location ~* \.(env|git|sql|bak|config|log|sh|php|asp|aspx|jsp)$ {
        return 444;
    }
    location ~* ^/(wp-admin|wp-login|phpmyadmin|admin\.php|xmlrpc\.php) {
        return 444;
    }

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location ~ ^/product/ {
        limit_req zone=general burst=20 nodelay;
        set $do_og 1;
        if ($arg_og_bypass = "1") { set $do_og 0; }
        if ($do_og = "1") {
            rewrite ^/product/.+/(\d+)$ /api/og/product/$1 last;
            rewrite ^/product/(\d+)$    /api/og/product/$1 last;
        }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/category/ {
        limit_req zone=general burst=20 nodelay;
        set $do_og_cat 1;
        if ($arg_og_bypass = "1") { set $do_og_cat 0; }
        if ($do_og_cat = "1") {
            rewrite ^/category/.+/(\d+)$ /api/og/category/$1 last;
            rewrite ^/category/(\d+)$    /api/og/category/$1 last;
        }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080/api/sitemap.xml;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/sync {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
    }

    location /api {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/caretech.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caretech.bg/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name caretech.bg www.caretech.bg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
