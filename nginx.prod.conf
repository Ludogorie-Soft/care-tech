# Production Nginx config — /etc/nginx/conf.d/caretech.bg.conf
# Deploy:
#   cp nginx.prod.conf /etc/nginx/conf.d/caretech.bg.conf
#   nginx -t && systemctl reload nginx

# ── Image proxy cache ──────────────────────────────────────────────────────────
proxy_cache_path /var/cache/nginx/images
    levels=1:2
    keys_zone=imgcache:20m
    max_size=2g
    inactive=24h
    use_temp_path=off;

# ── Rate limiting zones ────────────────────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=api:10m      rate=20r/s;
limit_req_zone  $binary_remote_addr zone=general:10m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# ── Bad bot detection ──────────────────────────────────────────────────────────
map $http_user_agent $bad_bot {
    default           0;
    ""                1;
    ~*sqlmap          1;
    ~*nikto           1;
    ~*nmap            1;
    ~*masscan         1;
    ~*zgrab           1;
    ~*python-requests 1;
    ~*go-http-client  1;
    ~*curl/           1;
}

# ── Redirect non-www → www (canonical domain) ─────────────────────────────────
server {
    listen 443 ssl;
    server_name caretech.bg;
    ssl_certificate     /etc/letsencrypt/live/caretech.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caretech.bg/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://www.caretech.bg$request_uri;
    }
}

server {
    server_name www.caretech.bg;

    client_max_body_size 50M;

    # ── Global limits ──────────────────────────────────────────────────────────
    limit_conn conn 30;

    # ── Block bad bots ────────────────────────────────────────────────────────
    if ($bad_bot) { return 444; }

    # ── Block common scan/attack paths ─────────────────────────────────────────
    location ~* \.(env|git|sql|bak|config|log|sh|php|asp|aspx|jsp)$ { return 444; }
    location ~* ^/(wp-admin|wp-login|phpmyadmin|admin\.php|xmlrpc\.php)  { return 444; }

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-XSS-Protection       "1; mode=block"                   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Product pages ──────────────────────────────────────────────────────────
    location ~ ^/product/ {
        limit_req zone=general burst=20 nodelay;
        # Strip ?og_bypass=1 — redirect to clean URL (fixes GSC "alternative page" for these URLs)
        # The trailing "?" drops the query string; without it nginx re-appends the args → 301 loop.
        if ($arg_og_bypass = 1) {
            rewrite ^(/product/.*)$ $1? permanent;
        }
        # Everyone — browsers, search engines, social crawlers — gets the page from OgMetaController:
        # the React app with this page's head tags and the right status (200/301/404).
        rewrite ^/product/.+/(\d+)/?$ /api/og/product/$1 last;
        rewrite ^/product/(\d+)/?$    /api/og/product/$1 last;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Category pages ────────────────────────────────────────────────────────
    location ~ ^/category/ {
        limit_req zone=general burst=20 nodelay;
        # Strip ?og_bypass=1 — redirect to clean URL (fixes GSC "alternative page" for these URLs)
        # The trailing "?" drops the query string; without it nginx re-appends the args → 301 loop.
        if ($arg_og_bypass = 1) {
            rewrite ^(/category/.*)$ $1? permanent;
        }
        # Everyone — browsers, search engines, social crawlers — gets the page from OgMetaController:
        # the React app with this page's head tags and the right status (200/301/404).
        rewrite ^/category/.+/(\d+)/?$ /api/og/category/$1 last;
        rewrite ^/category/(\d+)/?$    /api/og/category/$1 last;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Sitemap ────────────────────────────────────────────────────────────────
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080/api/sitemap.xml;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Image proxy with 24h cache ─────────────────────────────────────────────
    location /api/images/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 20s;

        proxy_cache                  imgcache;
        proxy_cache_valid            200 24h;
        proxy_cache_valid            404 1m;
        proxy_cache_valid            any 0;
        proxy_cache_use_stale        error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock             on;
        proxy_cache_lock_timeout     10s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ── Product and category pages (OgMetaController) ──────────────────────────
    location /api/og {
        # The /product/ and /category/ limit is gone after the internal rewrite; apply it here
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The URL the visitor asked for (before the internal rewrite to /api/og/...). OgMetaController
        # answers with a 301 when it is not the canonical one (old slug, shifted ID, missing /list/).
        proxy_set_header X-Original-URI    $request_uri;

        # Backend down or without index.html → the plain React app, which still works on its own
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
    }

    location @spa {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Sync endpoints (long timeout) ─────────────────────────────────────────
    location /api/sync {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
    }

    # ── All other API requests ─────────────────────────────────────────────────
    location /api {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── React SPA (catch-all) ─────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/caretech.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caretech.bg/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name caretech.bg www.caretech.bg;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
